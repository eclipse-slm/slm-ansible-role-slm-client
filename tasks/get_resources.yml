### Inputs:
- name: SLM_CLIENT | Assert Inputs | get_resources.yml
  ansible.builtin.assert:
    that:
      - (slm_client_slm_base_url is defined) and (slm_client_slm_base_url | length > 0)
      - (slm_client_user_access_token is defined) and (slm_client_user_access_token | length > 0)

- name: SLM_CLIENT | Get resources from SLM API
  ansible.builtin.uri:
    url: "{{ slm_client_slm_base_url }}/resource-management/resources"
    validate_certs: false
    method: GET
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{ slm_client_user_access_token }}"
  register: slm_client_get_resources_response

### Outputs:
- name: SLM_CLIENT | Set resources
  ansible.builtin.set_fact:
    slm_client_resources: "{{ slm_client_get_resources_response.json | default([]) }}"
